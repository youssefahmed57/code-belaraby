# Production override file. Use with:
# docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
# NEVER run this file alone.

services:
  backend:
    environment:
      ENVIRONMENT: production
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?COOKIE_DOMAIN must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set}
      COOKIE_SAMESITE: "none"
      SECURE_COOKIES: "true"
      RUN_SEED: "false"
      ALLOW_LOCAL_RUNNER_IN_PROD: "false"
      ALLOW_UNSAFE_LOCAL_CODE_EXECUTION: "false"
      USE_MOCK_VIDEO_PROVIDER: "false"
      USE_MOCK_JUDGE0: "false"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  execution-worker:
    environment:
      ENVIRONMENT: production
      ALLOW_LOCAL_RUNNER_IN_PROD: "false"
      ALLOW_UNSAFE_LOCAL_CODE_EXECUTION: "false"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
