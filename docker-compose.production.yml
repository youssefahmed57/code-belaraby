name: code_journey_academy_production

services:
  backend:
    environment:
      ENVIRONMENT: production
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-PROD_FRONTEND_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-'["https://PROD_FRONTEND_DOMAIN"]'}
      SECURE_COOKIES: "true"
      ALLOW_LOCAL_RUNNER_IN_PROD: "false"

  execution-worker:
    environment:
      ENVIRONMENT: production
      ALLOW_LOCAL_RUNNER_IN_PROD: "false"
