name: code_journey_academy

networks:
  internal_net:
    driver: bridge
    internal: false

services:
  postgres:
    image: postgres:15.6-alpine
    container_name: code_journey_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-code_journey_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # Notice: NO ports section to prevent public exposure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-code_journey_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: code_journey_redis
    restart: always
    # Notice: NO ports section to prevent public exposure
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code_journey_backend
    restart: always
    command: ["./start.sh"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      CSRF_SECRET: ${CSRF_SECRET}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET}
      RECEIPT_SIGNING_SECRET: ${RECEIPT_SIGNING_SECRET}
      VIDEO_SIGNING_SECRET: ${VIDEO_SIGNING_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-yourdomain.com}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-[]}
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JUDGE0_URL: ${JUDGE0_URL}
      RUN_SEED: ${RUN_SEED:-false}
      PRIVATE_STORAGE_LOCAL_DIR: /app/private_storage
      PUBLIC_ASSETS_LOCAL_DIR: /app/public_assets
      ALLOW_LOCAL_RUNNER_IN_PROD: ${ALLOW_LOCAL_RUNNER_IN_PROD:-false}
      ALLOW_UNSAFE_LOCAL_CODE_EXECUTION: ${ALLOW_UNSAFE_LOCAL_CODE_EXECUTION:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - private_receipts:/app/private_storage
      - public_assets:/app/public_assets
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  execution-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code_journey_execution_worker
    restart: always
    command: ["python", "app/worker.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      CSRF_SECRET: ${CSRF_SECRET}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET}
      RECEIPT_SIGNING_SECRET: ${RECEIPT_SIGNING_SECRET}
      VIDEO_SIGNING_SECRET: ${VIDEO_SIGNING_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JUDGE0_URL: ${JUDGE0_URL}
      ALLOW_LOCAL_RUNNER_IN_PROD: ${ALLOW_LOCAL_RUNNER_IN_PROD:-false}
      ALLOW_UNSAFE_LOCAL_CODE_EXECUTION: ${ALLOW_UNSAFE_LOCAL_CODE_EXECUTION:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  backup-worker:
    image: postgres:15.6-alpine
    container_name: code_journey_backup_worker
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-code_journey_db}
    entrypoint: ["sh", "-c", "while true; do sleep 86400; pg_dump -U $$PGUSER $$PGDATABASE > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql; done"]
    volumes:
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

volumes:
  postgres_data:
  redis_data:
  private_receipts:
  public_assets:
  backups_data:
