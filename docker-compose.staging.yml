name: code_journey_academy_staging

services:
  backend:
    environment:
      ENVIRONMENT: staging
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-STAGING_FRONTEND_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-'["https://STAGING_FRONTEND_DOMAIN"]'}
      SECURE_COOKIES: "true"
      ALLOW_LOCAL_RUNNER_IN_PROD: "false"

  execution-worker:
    environment:
      ENVIRONMENT: staging
      ALLOW_LOCAL_RUNNER_IN_PROD: "false"
