name: Verify Platform

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci_test_secret_key_which_is_long_enough_123456
      CSRF_SECRET: ci_test_csrf_secret_key_which_is_long_enough_1234
      SIGNED_URL_SECRET: ci_signed_url_secret_key_which_is_long_enough
      RECEIPT_SIGNING_SECRET: ci_receipt_signing_secret_which_is_long_enough
      VIDEO_SIGNING_SECRET: ci_video_signing_secret_which_is_long_enough__
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      SYNC_DATABASE_URL: sqlite:///./ci.db
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      ALLOW_UNSAFE_LOCAL_CODE_EXECUTION: "true"
      RUN_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock pip-audit
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run backend tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit --incremental false
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  docker-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      SECRET_KEY: ci_test_secret_key_which_is_long_enough_123456
      CSRF_SECRET: ci_test_csrf_secret_key_which_is_long_enough_1234
      SIGNED_URL_SECRET: ci_signed_url_secret_key_which_is_long_enough
      RECEIPT_SIGNING_SECRET: ci_receipt_signing_secret_which_is_long_enough
      VIDEO_SIGNING_SECRET: ci_video_signing_secret_which_is_long_enough__
      DATABASE_URL: postgresql+asyncpg://postgres:ci-postgres-password@postgres:5432/code_journey_db
      SYNC_DATABASE_URL: postgresql://postgres:ci-postgres-password@postgres:5432/code_journey_db
      REDIS_URL: redis://redis:6379/0
      JUDGE0_URL: http://judge0:2358
      COOKIE_DOMAIN: .codebelaraby.example
      ALLOWED_ORIGINS: '["https://app.codebelaraby.example"]'
      CSRF_TRUSTED_ORIGINS: '["https://app.codebelaraby.example"]'
    steps:
      - uses: actions/checkout@v4
      - name: Validate base Docker config
        run: docker compose config
      - name: Validate production Docker config
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - secret-scan
      - docker-config
    env:
      SECRET_KEY: ci_test_secret_key_which_is_long_enough_123456
      CSRF_SECRET: ci_test_csrf_secret_key_which_is_long_enough_1234
      SIGNED_URL_SECRET: ci_signed_url_secret_key_which_is_long_enough
      RECEIPT_SIGNING_SECRET: ci_receipt_signing_secret_which_is_long_enough
      VIDEO_SIGNING_SECRET: ci_video_signing_secret_which_is_long_enough__
      DATABASE_URL: sqlite+aiosqlite:///./ci-e2e.db
      SYNC_DATABASE_URL: sqlite:///./ci-e2e.db
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      ALLOW_UNSAFE_LOCAL_CODE_EXECUTION: "true"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          alembic upgrade head
          python -m app.db.seed
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > ../frontend-e2e.log 2>&1 &
      - name: Wait for services
        run: |
          python - <<'PY'
          import time, urllib.request
          for url in ["http://127.0.0.1:8000/health", "http://127.0.0.1:3000"]:
              for _ in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit(f"Service did not become ready: {url}")
          PY
      - name: Run critical Playwright suite
        working-directory: e2e
        run: npx playwright test tests/staging_smoke.spec.ts tests/dashboard_data.spec.ts tests/auth_cookies.spec.ts tests/password_reset_and_payments.spec.ts
