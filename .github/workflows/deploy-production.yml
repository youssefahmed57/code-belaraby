name: Legacy SSH Deploy (Manual Only)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA on origin/main that already passed Verify Platform
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-target:
    runs-on: ubuntu-latest
    steps:
      - name: Verify target SHA passed Verify Platform on main
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              branch: "main",
              event: "push",
              per_page: 50,
            });

            const verifiedRun = response.data.workflow_runs.find((run) =>
              run.head_sha === targetSha &&
              run.name === "Verify Platform" &&
              run.conclusion === "success"
            );

            if (!verifiedRun) {
              core.setFailed(
                `Refusing legacy SSH deployment workflow for ${targetSha}: Verify Platform has not succeeded on main.`
              );
              return;
            }

            core.notice(
              `Verified successful CI run ${verifiedRun.id} for ${targetSha}. ` +
              "Production deployments are managed by Coolify; this legacy SSH workflow is retained for manual reference only."
            );

      - name: Stop legacy workflow before SSH deployment
        run: |
          echo "Coolify is the production source of truth."
          echo "This legacy SSH workflow remains manual-only to avoid conflicting deployment architectures."
