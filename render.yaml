services:
  - type: web
    name: code-belaraby-backend-staging
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    startCommand: chmod +x start.sh && ./start.sh
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: SIGNED_URL_SECRET
        sync: false
      - key: RECEIPT_SIGNING_SECRET
        sync: false
      - key: VIDEO_SIGNING_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: payment-receipts
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: SECURE_COOKIES
        value: "true"
      - key: RUN_SEED
        value: "false"
      - key: ALLOW_UNSAFE_LOCAL_CODE_EXECUTION
        value: "false"
      - key: ALLOW_LOCAL_RUNNER_IN_PROD
        value: "false"
      - key: JUDGE0_URL
        sync: false
      - key: CLOUDFLARE_STREAM_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: CLOUDFLARE_STREAM_KEY_ID
        sync: false
      - key: CLOUDFLARE_STREAM_PEM_KEY
        sync: false
      - key: CLOUDFLARE_STREAM_CUSTOMER_SUBDOMAIN
        sync: false
      - key: DB_POOL_SIZE
        value: "20"
      - key: DB_MAX_OVERFLOW
        value: "40"

  - type: worker
    name: code-belaraby-worker-staging
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    startCommand: python app/worker.py
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: REDIS_URL
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: ALLOW_UNSAFE_LOCAL_CODE_EXECUTION
        value: "false"
      - key: ALLOW_LOCAL_RUNNER_IN_PROD
        value: "false"
